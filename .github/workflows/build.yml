name: build-artifact

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev xxd
      - name: Build and generate seed
        run: bash scripts/build.sh
      - name: Validate seed
        run: test -s input/seed.bin
